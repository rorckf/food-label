server:
  port: 8080

spring:
  application:
    name: foodlabel

  # 静态资源路径配置 - 指向前端目录
  web:
    resources:
      static-locations:
        - file:../frontend/dist/
        - file:./uploads/

  # MySQL数据库配置
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/health_food?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123123}
    driver-class-name: com.mysql.cj.jdbc.Driver

  # 文件上传配置
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB

  # JSON序列化配置
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

# MyBatis-Plus配置
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
      # 权威 schema 无 status 字段，软删未启用

# JWT配置（生产环境必须通过环境变量 JWT_SECRET 覆盖）
jwt:
  secret: ${JWT_SECRET:foodlabel-dev-only-secret-key-do-not-use-in-production-256bits}
  expiration: 86400000  # 24小时，单位毫秒

# Qwen-VL 配置（密钥只从环境变量 QWEN_API_KEY 读取，不在配置文件中保存）
qwen-vl:
  enabled: true
  api-key: ${QWEN_API_KEY:}
  endpoint: https://dashscope.aliyuncs.com/api/v1/services/aigc/multimodal-generation/generation
  model: qwen-vl-plus
  timeout: 30000  # 30秒超时

# 营养摄入参考值配置
nutrition:
  daily-sodium-limit: 2000  # 成人每日钠建议摄入量(mg)
  calorie-per-gram-protein: 4
  calorie-per-gram-fat: 9
  calorie-per-gram-carb: 4

# 文件存储配置（公网部署时通过 FILE_BASE_URL 指定外网可访问地址）
file:
  upload-dir: ${FILE_UPLOAD_DIR:./uploads}
  base-url: ${FILE_BASE_URL:http://localhost:8080/uploads}

# CORS配置（生产环境通过环境变量 CORS_ALLOWED_ORIGINS 指定具体域名）
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:*}


dashscope:
  api-key: ${DASHSCOPE_API_KEY:${QWEN_API_KEY:your-api-key-here}}
  base-url: https://dashscope.aliyuncs.com/api/v1
